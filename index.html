<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="panel">
    <h2>Admin Access</h2>
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="admin">
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <div class="input-group">
      <label for="captchaInput">What is <span id="captchaQuestion"></span>?</label>
      <input type="text" id="captchaInput" placeholder="Your answer">
    </div>
    <button class="login-btn" onclick="checkLogin()">Enter</button>
  </div>
  <div id="welcomeMessage" class="welcome" style="display: none;">Welcome, Admin!</div>
  <script>
    let failedAttempts = 0;
    let lockUntil = null;
    let captchaAnswer = 0;

    function generateCaptcha() {
      const a = Math.floor(Math.random() * 10) + 1;
      const b = Math.floor(Math.random() * 10) + 1;
      captchaAnswer = a + b;
      document.getElementById("captchaQuestion").textContent = `${a} + ${b}`;
    }

    function checkLogin() {
      const now = Date.now();
      if (lockUntil && now < lockUntil) {
        alert("Terlalu banyak percobaan. Coba lagi dalam 5 menit.");
        return;
      }

      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const captchaInput = parseInt(document.getElementById('captchaInput').value);

      if (captchaInput !== captchaAnswer) {
        alert("Captcha salah!");
        generateCaptcha();
        return;
      }

      if (user === 'admin' && pass === 'admin') {
        document.querySelector('.panel').style.display = 'none';
        const welcome = document.getElementById('welcomeMessage');
        welcome.style.display = 'block';
      } else {
        failedAttempts++;
        if (failedAttempts >= 5) {
          lockUntil = now + 5 * 60 * 1000; // 5 menit
          alert("Terlalu banyak percobaan gagal. Terkunci selama 5 menit.");
        } else {
          alert('Invalid credentials!');
        }
      }
    }

    generateCaptcha();
  </script>
</body>
</html>
